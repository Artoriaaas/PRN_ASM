name: prn-asm

services:
  gateway:
    build:
      context: ../gateway
    ports:
      - '${GATEWAY_PORT:-18080}:8080'
    depends_on:
      - game-service
      - user-service
      - support-service
      - multiplayer-service

  web:
    build:
      context: ../clients
      args:
        - VITE_API_URL=
    ports:
      - '${WEB_PORT:-5173}:80'
    depends_on:
      - gateway

  game-service:
    build:
      context: ..
      dockerfile: services/Game/Game.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Database=game_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Kafka__BootstrapServers=kafka:9092
      - Services__User=http://user-service:8080
      - Firebase__ProjectId=${FIREBASE_PROJECT_ID:-prn222-469cc}
      - Kestrel__Endpoints__Grpc__Url=http://*:8080
      - Kestrel__Endpoints__Grpc__Protocols=Http2
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  user-service:
    build:
      context: ..
      dockerfile: services/User/User.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Database=user_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Kafka__BootstrapServers=kafka:9092
      - Firebase__ProjectId=${FIREBASE_PROJECT_ID:-prn222-469cc}
      - Kestrel__Endpoints__Grpc__Url=http://*:8080
      - Kestrel__Endpoints__Grpc__Protocols=Http2
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  support-service:
    build:
      context: ..
      dockerfile: services/Support/Support.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Database=support_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Services__Game=http://game-service:8080
      - Services__User=http://user-service:8080
      - Firebase__ProjectId=${FIREBASE_PROJECT_ID:-prn222-469cc}
      - Kestrel__Endpoints__Http__Url=http://*:8080
      - Kestrel__Endpoints__Http__Protocols=Http1
    ports:
      - '5104:8080'
    depends_on:
      postgres:
        condition: service_healthy
      game-service:
        condition: service_started
      user-service:
        condition: service_started

  multiplayer-service:
    build:
      context: ..
      dockerfile: services/Multiplayer/Multiplayer.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Database=multiplayer_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - Kafka__BootstrapServers=kafka:9092
      - Services__User=http://user-service:8080
      - Services__Game=http://game-service:8080
      - Firebase__ProjectId=${FIREBASE_PROJECT_ID:-prn222-469cc}
      - Kestrel__Endpoints__Grpc__Url=http://*:8080
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - Kestrel__Endpoints__Web__Url=http://*:8081
      - Kestrel__Endpoints__Web__Protocols=Http1
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
volumes:
  pgdata: {}
