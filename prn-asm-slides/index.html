/* Bố cục: sân khấu 16:9 cỡ 1600x900; sợi chỉ chạy dọc đáy là thanh tiến độ, nối cả bài từ khung dệt đến AI. */
:root{
  color-scheme:light;
  /* Mặc định: Giấy kỹ thuật. Nền giấy kẻ ô, mực xanh cobalt, nhấn cam: dễ đọc khi phòng sáng. */
  --cham:#F2F4F0; --cham-2:#E2E6DF; --cham-3:#BEC6BC; --cham-deep:#FFFFFF;
  --vai:#141E2B; --vai-2:#3F4B57; --vai-3:#667380;
  --son:#1F4FD8; --nghe:#C2480F; --si:#0B7A6E;
  --on-son:#FFFFFF; --on-nghe:#FFFFFF; --on-si:#FFFFFF; --on-vai:#FFFFFF;
  --tex:rgba(31,79,216,.06); --ghost:rgba(20,30,43,.09);
  --display:"Bricolage Grotesque","Be Vietnam Pro","Segoe UI",sans-serif;
  --body:"Be Vietnam Pro","Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono","Consolas",monospace;
}
:root[data-look="reu"]{color-scheme:dark;--cham:#10271F;--cham-2:#1A3A2F;--cham-3:#2F5A4A;--cham-deep:#0A1B15;--vai:#F1EFE3;--vai-2:#C2CFC3;--vai-3:#93A89B;--son:#FF8A5B;--nghe:#F2C14E;--si:#7BE0B5;--on-son:#0A1B15;--on-nghe:#0A1B15;--on-si:#0A1B15;--on-vai:#0A1B15;--tex:rgba(255,255,255,.022);--ghost:rgba(241,239,227,.1)}
:root[data-look="cham"]{color-scheme:dark;--cham:#17205E;--cham-2:#222E7E;--cham-3:#33409A;--cham-deep:#0D133D;--vai:#F5F1E6;--vai-2:#C6C8E4;--vai-3:#9DA2CF;--son:#FF5C86;--nghe:#FFC93C;--si:#4BE3C4;--on-son:#0D133D;--on-nghe:#0D133D;--on-si:#0D133D;--on-vai:#0D133D;--tex:rgba(255,255,255,.022);--ghost:rgba(245,241,230,.1)}

/* ===== deck.css.part ===== */
/* PRN ASM — Bản vẽ kỹ thuật động (design system ported from MLN122 · Bản B)
   Sân khấu 1600×900, nền giấy kẻ ô, mực cobalt, nhấn cam, chữ mono cho nhãn kỹ thuật. */

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--cham-deep);color:var(--vai);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--si)}
:focus-visible{outline:3px solid var(--nghe);outline-offset:3px}

/* ---------- khung trình chiếu ---------- */
.presentation-shell{position:fixed;inset:0;background:var(--cham-deep);overflow:hidden;user-select:none}
.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;z-index:1}
.slide-canvas{position:relative;width:1600px;height:900px;overflow:hidden;overflow:clip;background:var(--cham);
  background-image:linear-gradient(var(--tex) 1px,transparent 1px),linear-gradient(90deg,var(--tex) 1px,transparent 1px);background-size:32px 32px;
  box-shadow:0 30px 90px rgba(10,14,24,.22)}
.slide-canvas::after{content:"";position:absolute;inset:18px;border:1px solid var(--cham-3);pointer-events:none;opacity:.55}
.slide-inner{position:relative;width:1600px;height:900px;padding:44px 76px 84px;display:flex;flex-direction:column;gap:22px;overflow:hidden}
.slide-canvas .r{animation:up .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*90ms)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- chữ ---------- */
.eb{font:600 19px/1.2 var(--mono);color:var(--nghe);letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.eb i{display:inline-block;width:34px;height:2px;background:var(--nghe);flex:0 0 auto}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;font-weight:800}
h2{font-size:58px;line-height:1.06;letter-spacing:-.015em;max-width:1400px}
h2 em{font-style:normal;color:var(--son)}
h2 em.nl{color:var(--nghe)}
h3{font-weight:600;font-size:30px;line-height:1.15}
h4{font-weight:600;font-size:24px;line-height:1.2}
p{margin:0;font-size:26px;line-height:1.38}
.sm{font-size:21px;line-height:1.4;color:var(--vai-2)}
.xs{font-size:18px;line-height:1.42;color:var(--vai-3)}
.mono{font-family:var(--mono)}
.lbl{font:600 15px var(--mono);letter-spacing:.08em;color:var(--vai-2);text-transform:uppercase}
.qm{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:500}
b,strong{font-weight:600}

/* ---------- thành phần ---------- */
.tag{display:inline-block;font:600 16px/1 var(--mono);padding:7px 10px;background:var(--son);color:var(--on-son);vertical-align:middle;white-space:nowrap}
.tag.m{background:var(--si);color:var(--on-si)}
.tag.y{background:var(--nghe);color:var(--on-nghe)}
.tag.o{background:transparent;color:var(--vai-2);box-shadow:inset 0 0 0 1.5px var(--cham-3)}
.grow{flex:1;min-height:0}
.row{display:grid;gap:28px;min-height:0}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--cham-2);padding:22px 24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel.dark{background:var(--cham-deep)}
.panel.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--cham-3)}
.panel.son{background:var(--son);color:var(--on-son)}
.panel.son .sm,.panel.son .lbl{color:var(--on-son);opacity:.82}
.leaf{background:var(--cham-2);padding:14px 18px;font-size:22px;line-height:1.3}
.chain{display:flex;align-items:center;gap:8px}
.chain b{flex:1;padding:12px;background:var(--cham-deep);font-size:20px;text-align:center;font-weight:600}
.chain i{width:26px;height:3px;background:var(--nghe);flex:0 0 auto}
.kv{display:grid;grid-template-columns:1fr auto;font-size:22px;gap:0 16px}
.kv>*{padding:8px 0;border-bottom:1px solid var(--cham-3)}
.kv b{font:600 22px var(--mono);text-align:right;white-space:nowrap}
.big{display:block;font:800 62px/1 var(--display);letter-spacing:-.02em;width:fit-content}
.big.son{color:var(--son)}.big.nghe{color:var(--nghe)}.big.si{color:var(--si)}

/* bảng */
table{border-collapse:collapse;width:100%;font-size:22px}
th{font:600 16px var(--mono);letter-spacing:.06em;text-align:left;color:var(--nghe);text-transform:uppercase;padding:8px 14px 8px 0;border-bottom:1.5px solid var(--cham-3)}
td{padding:9px 14px 9px 0;border-top:1px solid var(--cham-3);vertical-align:top;line-height:1.3}
tr:first-child td{border-top:0}
table.tight td{padding-block:7px;font-size:21px}
table.tight th{padding-bottom:7px}
td.mono,th.mono{font-family:var(--mono);font-size:17px;letter-spacing:0}
.method{font:600 14px var(--mono);padding:3px 6px;background:var(--vai);color:var(--on-vai);display:inline-block;min-width:62px;text-align:center}
.method.g{background:var(--si);color:var(--on-si)}
.method.p{background:var(--son);color:var(--on-son)}
.method.y{background:var(--nghe);color:var(--on-nghe)}

/* ---------- hình kỹ thuật ---------- */
.fig{position:relative;border:1.5px solid var(--vai);background:var(--cham-deep);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.fig>.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;justify-content:center}
.fig>.tick{position:absolute;width:16px;height:16px;pointer-events:none;border:0}
.fig>.tick::before,.fig>.tick::after{content:"";position:absolute;background:var(--nghe)}
.fig>.tick::before{left:7px;top:0;bottom:0;width:2px}
.fig>.tick::after{top:7px;left:0;right:0;height:2px}
.fig>.tick.tl{left:-9px;top:-9px}.fig>.tick.tr{right:-9px;top:-9px}
.fig>.tick.bl{left:-9px;bottom:-9px}.fig>.tick.br{right:-9px;bottom:-9px}
.cap{display:flex;justify-content:space-between;gap:12px;font:600 13px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--vai-3);padding-top:9px;border-top:1px solid var(--cham-3)}
.cap b{color:var(--nghe);font-weight:600}
.fignote{font:600 14px var(--mono);letter-spacing:.05em;color:var(--vai-3);text-transform:uppercase}

/* hộp kỹ thuật / node */
.node{background:var(--cham-deep);box-shadow:inset 0 0 0 1.5px var(--vai);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.node b{font:600 21px/1.15 var(--display);letter-spacing:-.01em}
.node span{font:600 13px/1.35 var(--mono);letter-spacing:.05em;color:var(--vai-3);text-transform:uppercase}
.node.son{box-shadow:inset 0 0 0 2px var(--son);background:var(--cham-deep)}
.node.son b{color:var(--son)}
.node.nghe{box-shadow:inset 0 0 0 2px var(--nghe)}
.node.nghe b{color:var(--nghe)}
.node.si{box-shadow:inset 0 0 0 1.5px var(--si)}
.node.si b{color:var(--si)}
.node.fill{background:var(--son);box-shadow:none;color:var(--on-son)}
.node.fill b{color:var(--on-son)}
.node.fill span{color:var(--on-son);opacity:.75}
.node.flat{background:var(--cham-2);box-shadow:none}

.stack{display:flex;flex-direction:column;gap:10px;min-height:0}
.hstack{display:flex;align-items:center;gap:12px;min-width:0}
.vline{position:relative;height:26px;display:grid;place-items:center;color:var(--vai-3);font:600 13px var(--mono);letter-spacing:.08em}
.vline::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1.5px solid var(--cham-3)}
.vline::after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--cham-3);border-bottom:0}
.vline span{position:relative;background:var(--cham);padding:0 8px;color:var(--vai-3)}
.harrow{display:grid;place-items:center;color:var(--vai-3);font-size:22px;flex:0 0 30px}

/* danh sách nguồn / ghi chú trên slide */
.n{font-weight:inherit;border-bottom:2px dotted var(--vai-3);cursor:help}
.foot{position:absolute;left:76px;right:76px;bottom:46px;font-size:16px;line-height:1.3;color:var(--vai-3);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;z-index:4}
.foot b{font:600 14px var(--mono);letter-spacing:.06em;color:var(--vai-2);text-transform:uppercase;font-weight:600}
.foot .dot{color:var(--cham-3)}

/* số trang + sợi chỉ tiến độ */
.pg{position:absolute;right:76px;top:16px;background:var(--cham);padding:2px 10px;font:600 22px var(--mono);color:var(--vai-2);z-index:6;letter-spacing:.02em}
.pg small{font-size:14px;color:var(--vai-3)}
.thread{position:absolute;left:76px;right:76px;bottom:16px;height:22px;z-index:5;display:flex;align-items:center;justify-content:space-between}
.thread::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px dashed var(--cham-3)}
.thread i{width:9px;height:9px;border-radius:50%;background:var(--cham);box-shadow:inset 0 0 0 1.5px var(--cham-3);position:relative;display:block}
.thread i.done{background:var(--son);box-shadow:none}
.thread i.now{background:var(--nghe);box-shadow:0 0 0 4px var(--cham),0 0 0 5.5px var(--nghe)}
.thread i.major{width:13px;height:13px}

/* ---------- thanh điều khiển ---------- */
.app-bottom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;z-index:8;
  height:44px;padding:4px 12px;border:1px solid var(--cham-3);background:var(--cham);font:600 14px var(--mono);color:var(--vai-2);box-shadow:0 10px 28px rgba(12,18,28,.14)}
.nav-controls{display:flex;gap:4px}
.nav-btn,.tool-btn{border:1px solid transparent;height:30px;min-width:30px;padding:0 8px;display:grid;place-items:center;line-height:1;color:var(--vai);font:600 15px var(--mono)}
.nav-btn:hover:not(:disabled),.tool-btn:hover{border-color:var(--cham-3);background:var(--cham-2)}
.nav-btn:disabled{opacity:.3}
.active-nav{color:var(--son)}
.progress-zone{display:flex;align-items:center;gap:10px}
.progress-rail{width:180px;height:3px;background:var(--cham-3);overflow:hidden}
.progress-current{height:100%;background:var(--nghe);transition:width .35s}
.progress-numbers{font-size:13px;white-space:nowrap;color:var(--vai-2)}
.nav-tools{display:flex;gap:2px;border-left:1px solid var(--cham-3);padding-left:12px}
.tool-btn{font-size:15px;color:var(--vai-3)}
.tool-btn.selected{background:var(--nghe);color:var(--on-nghe)}
.app-topline{position:absolute;left:28px;top:14px;display:flex;align-items:center;gap:9px;color:var(--vai-3);z-index:7;font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;pointer-events:none}
.live-dot{height:6px;width:6px;border-radius:50%;background:var(--nghe)}
.app-divider{width:1px;height:13px;background:var(--cham-3);margin:0 2px}

.modal-backdrop{position:absolute;inset:0;z-index:20;background:color-mix(in srgb,var(--cham-deep) 82%,transparent);display:grid;place-items:center;backdrop-filter:blur(2px)}
.overview-modal,.help-modal{width:min(1180px,90vw);max-height:82vh;background:var(--cham);border:1.5px solid var(--vai);padding:26px 30px;box-shadow:0 30px 80px rgba(10,14,24,.3);overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font:600 20px var(--display)}
.modal-head button{width:34px;height:34px;border:1.5px solid var(--cham-3);font:600 19px var(--mono);display:grid;place-items:center}
.modal-head button:hover{background:var(--cham-2)}
.slide-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slide-thumb{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px;background:var(--cham-2);cursor:pointer;border-left:5px solid transparent}
.slide-thumb:hover{border-color:var(--cham-3)}
.slide-thumb.current{border-color:var(--nghe);background:var(--cham-deep)}
.thumb-n{font:600 17px var(--mono);color:var(--nghe)}
.thumb-name{font:600 19px/1.2 var(--body);color:var(--vai)}
.thumb-bar{grid-column:1/3;height:2px;background:var(--cham-3)}
.help-list{display:flex;flex-direction:column;gap:2px}
.help-row{display:flex;align-items:center;gap:16px;padding:9px 0;border-top:1px solid var(--cham-3);font-size:20px}
.help-row:first-child{border-top:0}
.keycap{font:600 14px var(--mono);min-width:110px;padding:5px 9px;background:var(--cham-2);box-shadow:inset 0 0 0 1.5px var(--cham-3);text-align:center}

/* ---------- dải ghi chú cho người nói (phím N) ---------- */
.note-band{position:absolute;left:0;right:0;bottom:62px;z-index:7;margin:0 auto;width:min(1120px,86%);
  background:var(--cham-deep);border:1.5px solid var(--vai);border-left:6px solid var(--nghe);padding:14px 20px;
  box-shadow:0 18px 42px rgba(12,18,28,.2);display:flex;flex-direction:column;gap:6px}
.note-band b{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--nghe)}
.note-band p{margin:0;font:400 18px/1.45 var(--body);color:var(--vai-2)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== prn.css.part ===== */
/* Bố cục riêng cho 18 tờ PRN ASM. Mọi màu lấy từ biến trong tokens.css.part. */

/* ---------- 01 · bìa ---------- */
.cover{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 570px;gap:52px;align-items:center;min-height:0}
.cover-copy{display:flex;flex-direction:column;gap:20px;min-width:0}
.cover h1{font-size:100px;line-height:.96;letter-spacing:-.03em;max-width:880px}
.cover h1 em{font-style:normal;color:var(--son)}
.cover-sub{max-width:700px;font-size:24px;line-height:1.44;color:var(--vai-2)}
.cover-meta{display:grid;grid-template-columns:auto 1fr;gap:3px 22px;font-size:19px;max-width:740px;border-top:1.5px solid var(--vai);padding-top:14px}
.cover-meta b{font:600 14px var(--mono);letter-spacing:.07em;color:var(--vai-3);text-transform:uppercase;padding-top:4px}
.mem{display:grid;grid-template-columns:1fr 1fr;gap:2px 26px}
.mem i{font-style:normal;white-space:nowrap;font-size:18px}
.mem small{font:500 12px var(--mono);color:var(--vai-3);margin-left:5px}
.cover-fig{height:600px;display:flex;flex-direction:column;gap:10px}
.cover-fig .body{flex:1;display:grid;place-items:center;min-height:0}

/* bàn cờ vẽ nét */
.sudoku{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);aspect-ratio:1;width:100%;border:1.5px solid var(--vai);background:var(--cham-deep)}
.sudoku span{display:grid;place-items:center;font:600 15px var(--mono);color:var(--vai-3);border-right:1px solid var(--cham-3);border-bottom:1px solid var(--cham-3);min-width:0}
.sudoku span:last-child{border-right:0}
.sudoku span.bR{border-right:1.5px solid var(--vai)}
.sudoku span.bB{border-bottom:1.5px solid var(--vai)}
.sudoku span.given{color:var(--son)}
.sudoku span.focus{background:var(--cham-2);color:var(--nghe)}
.dim{display:flex;align-items:center;gap:8px;font:600 12px var(--mono);letter-spacing:.08em;color:var(--vai-3);text-transform:uppercase}
.dim::before,.dim::after{content:"";height:1px;background:var(--cham-3);flex:1}

/* ---------- 02 · mục lục ---------- */
.toc{display:grid;grid-template-columns:repeat(3,1fr);gap:0;align-content:center;flex:1;min-height:0}
.toc-col{display:flex;flex-direction:column;justify-content:center;padding:0 30px;border-left:1px solid var(--cham-3)}
.toc-col:first-child{border-left:0;padding-left:0}
.toc-col:last-child{padding-right:0}
.toc-item{display:grid;grid-template-columns:42px 1fr;column-gap:12px;padding:16px 0;border-top:1px solid var(--cham-3)}
.toc-item:first-child{border-top:0}
.toc-item em{grid-area:1/1/3/2;font:700 15px var(--mono);font-style:normal;color:var(--si);letter-spacing:.04em;padding-top:5px}
.toc-item b{grid-area:1/2/2/3;font:600 22px/1.2 var(--display);color:var(--vai)}
.toc-item span{grid-area:2/2/3/3;font-size:15px;line-height:1.3;color:var(--vai-3)}
.weights{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px}
.weights .k{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--vai-3);margin-right:4px}
.weights .w{display:inline-flex;align-items:baseline;gap:6px;padding:5px 11px;background:var(--cham-2)}
.weights .w b{font:700 15px var(--mono);color:var(--son)}
.weights .w span{font-size:14px;color:var(--vai-2)}

/* ---------- 03 · phạm vi ---------- */
.ticks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.ticks li{display:flex;gap:11px;font-size:21px;line-height:1.3;align-items:flex-start}
.ticks li::before{content:"—";color:var(--nghe);font-weight:600;flex:0 0 auto;line-height:1.25}
.panel h3{font-size:27px}
.panel .mono.lbl{margin-top:auto}

/* ---------- 04 · kiến trúc ---------- */
.arch{display:flex;flex-direction:column;justify-content:center;gap:0;flex:1;min-height:0;padding:4px 0}
.arch .band{display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--cham-2);padding:10px 18px;box-shadow:inset 0 0 0 1.5px var(--cham-3)}
.arch .band b{font:600 21px var(--display)}
.arch .band span{font:600 13px var(--mono);letter-spacing:.06em;color:var(--vai-3);text-transform:uppercase;text-align:right}
.arch .svcs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex:1}
.arch .data{display:grid;grid-template-columns:repeat(4,1fr) 1.05fr 1.05fr;gap:12px;flex:1}
.arch .node{justify-content:center;padding:16px 18px}
.arch .node b{font-size:23px}
.arch .node span{font-size:12.5px}
.arch .c4row{display:grid;grid-template-columns:224px 54px 1fr 54px 224px;align-items:stretch}
.arch .c4row .band{padding:9px 18px}
.arch .c4-ext{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 14px;border:1.5px dashed var(--cham-3)}
.arch .c4-ext b{font:600 18px/1.15 var(--display)}
.arch .c4-ext span{font:600 10.5px/1.3 var(--mono);letter-spacing:.05em;color:var(--vai-3);text-transform:uppercase;text-align:left}
.arch .c4-ext.actor{border-color:var(--son)}
.arch .c4-ext.actor b{color:var(--son)}
.arch .c4-ext.ext{border-color:var(--si)}
.arch .c4-ext.ext b{color:var(--si)}
.arch .c4-link{position:relative;display:grid;place-items:center;font:600 10px/1.2 var(--mono);letter-spacing:.04em;color:var(--si);text-transform:uppercase;text-align:center}
.arch .c4-link::before{content:"";position:absolute;left:8px;right:12px;top:50%;border-top:1.5px solid var(--cham-3)}
.arch .c4-link::after{content:"";position:absolute;right:7px;top:calc(50% - 4px);border:4px solid transparent;border-left-color:var(--cham-3);border-right:0}
.arch .c4-link span{position:relative;background:var(--cham-2);padding:2px 5px;color:var(--si)}

/* ---------- 05 · tầng ---------- */
.layers{display:flex;flex-direction:column;gap:8px;justify-content:stretch;flex:1;min-height:0}
.layers .lay{display:grid;grid-template-columns:150px 1fr;gap:0;align-items:stretch;min-height:0;flex:1}
.layers .lay>em{font:600 13px var(--mono);letter-spacing:.06em;color:var(--vai-3);text-transform:uppercase;display:flex;align-items:center;border-right:2px solid var(--cham-3);padding-right:14px;font-style:normal}
.layers .lay>div{padding:12px 18px;background:var(--cham-2);display:flex;flex-direction:column;justify-content:center;gap:3px}
.layers .lay.son>div{background:var(--son);color:var(--on-son)}
.layers .lay.son>div span{color:var(--on-son);opacity:.8}
.layers .lay>div b{font:600 22px var(--display)}
.layers .lay>div span{font:600 13px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--vai-3)}
.dbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dbs .node b{font-size:18px}

/* ---------- 06 · ERD ---------- */
.erd{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px 18px;flex:1;min-height:0}
.erd-card{display:flex;flex-direction:column;gap:10px;padding:14px 16px 12px;background:var(--cham-2);border-top:4px solid var(--son);min-height:0}
.erd-card:nth-child(2){border-top-color:var(--si)}
.erd-card:nth-child(3){border-top-color:var(--nghe)}
.erd-card:nth-child(4){border-top-color:var(--vai-2)}
.erd-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.erd-head b{font:600 21px/1.1 var(--mono);letter-spacing:-.01em}
.erd-head span{font:600 10.5px var(--mono);letter-spacing:.05em;color:var(--vai-3);text-transform:uppercase;text-align:right}
.erd-body{display:flex;flex-direction:column;gap:8px;justify-content:center;flex:1;min-height:0}
.erd-chain{display:flex;align-items:stretch;gap:0}
.erd-ent{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center;padding:10px 12px;background:var(--cham-deep);box-shadow:inset 0 0 0 1.5px var(--cham-3)}
.erd-ent b{font:600 15px/1.2 var(--mono);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erd-ent span{font:600 10px/1.2 var(--mono);letter-spacing:.04em;color:var(--vai-3);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erd-rel{position:relative;flex:0 0 38px;display:grid;place-items:center;font:600 10.5px var(--mono);color:var(--si);letter-spacing:0}
.erd-rel::before{content:"";position:absolute;left:3px;right:3px;top:50%;border-top:1px dashed var(--cham-3)}
.erd-rel span{position:relative;background:var(--cham-2);padding:2px 4px}
.erd-more{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 8px;padding-top:8px;border-top:1px dashed var(--cham-3);font:600 10.5px/1.3 var(--mono);letter-spacing:.03em;color:var(--vai-3);text-transform:uppercase}
.erd-more>span{color:var(--son)}
.erd-more i{font-style:normal;padding:2px 7px;background:var(--cham-deep);box-shadow:inset 0 0 0 1px var(--cham-3)}

/* ---------- 07 · REST ---------- */
.api{display:flex;flex-direction:column;gap:6px;font:600 17px/1.3 var(--mono);color:var(--vai)}
.api .ep{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--cham-3)}
.api .ep:first-child{border-top:0}
.api .ep span{font-size:16px}
.api .grp{display:flex;align-items:center;gap:10px;font:600 13px var(--mono);letter-spacing:.06em;color:var(--vai-3);text-transform:uppercase;margin-top:6px}
.q{display:flex;flex-wrap:wrap;gap:7px}
.q code{font:600 15px var(--mono);padding:4px 8px;background:var(--cham-2);box-shadow:inset 0 0 0 1px var(--cham-3)}

/* ---------- 08 · worker ---------- */
.wk{display:grid;grid-template-columns:auto 1fr auto;gap:0 20px;align-items:center;align-content:center;flex:1;padding:18px 24px 18px 20px;background:var(--cham-2);border-left:6px solid var(--son)}
.wk:nth-child(even){border-left-color:var(--nghe)}
.wk .iv{grid-area:1/1/3/2;font:800 40px/1 var(--display);color:var(--son);min-width:120px}
.wk:nth-child(even) .iv{color:var(--nghe)}
.wk b{grid-area:1/2/2/3;font:600 26px var(--display);align-self:end}
.wk p{grid-area:2/2/3/3;font-size:21px;line-height:1.34;color:var(--vai-2);margin-top:2px;align-self:start}
.wk .file{grid-area:1/3/3/4;font:600 13px var(--mono);color:var(--vai-3);letter-spacing:.02em;text-align:right;max-width:300px}

/* ---------- 09 · kafka ---------- */
.pipe{display:flex;align-items:stretch;gap:8px}
.pipe .node{flex:1;justify-content:center}
.pipe .node b{font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.branch{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.topic{background:var(--vai);color:var(--on-vai);padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.topic b{font:600 22px var(--display)}
.topic span{font:600 13px var(--mono);letter-spacing:.06em;opacity:.75}
.evt{display:flex;gap:8px;flex-wrap:wrap}
.evt code{font:600 14px var(--mono);padding:4px 8px;background:var(--cham-2);color:var(--vai-2);box-shadow:inset 0 0 0 1px var(--cham-3)}

/* ---------- 10 · proto ---------- */
.protos{display:flex;flex-direction:column;gap:10px}
.protos .pf{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 14px;background:var(--cham-2);font:600 17px var(--mono)}
.protos .pf span{font-size:13px;color:var(--vai-3);letter-spacing:.05em;text-transform:uppercase;font-family:var(--mono)}
.gen{display:flex;flex-direction:column;gap:10px;justify-content:space-between;flex:1;min-height:0}
.gen .node{flex:1;justify-content:center}

/* ---------- 11 · auth ---------- */
.seq{display:flex;flex-direction:column;gap:8px;justify-content:space-between;flex:1;min-height:0}
.seq .st{display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:center;flex:1;padding:11px 16px;background:var(--cham-2)}
.seq .st b{font:600 20px/1.25 var(--display)}
.seq .st span{font:600 13px var(--mono);letter-spacing:.05em;color:var(--vai-3);text-transform:uppercase;text-align:right}
.seq .st i{font:600 15px var(--mono);color:var(--nghe);font-style:normal}
.claim{background:var(--vai);color:var(--on-vai);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.claim b{font:600 17px var(--mono);letter-spacing:.04em}
.claim span{font-size:18px;line-height:1.35;color:var(--on-vai);opacity:.8}

/* ---------- 12 · luồng ---------- */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:0;align-items:stretch}
.steps .st{position:relative;padding:14px 14px 16px;background:var(--cham-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.steps .st+.st{margin-left:8px}
.steps .st::before{content:"";position:absolute;left:-9px;top:50%;border:8px solid transparent;border-left-color:var(--cham-3);transform:translateY(-50%)}
.steps .st:first-child::before{display:none}
.steps .st.hot{background:var(--son);color:var(--on-son)}
.steps .st.hot .sm,.steps .st.hot span{color:var(--on-son);opacity:.82}
.steps .n{font:600 15px var(--mono);color:var(--nghe);border:0;letter-spacing:.06em}
.steps .st.hot .n{color:var(--on-son)}
.steps .st b{font:600 19px/1.2 var(--display)}
.steps .st .sm{font-size:17px;line-height:1.3}

/* ---------- 13 · hub ---------- */
.hub{display:grid;grid-template-columns:1fr 380px 1fr;gap:20px;align-items:center;flex:1;min-height:0}
.hubcol{display:flex;flex-direction:column;gap:18px;justify-content:center}
.hubcol .node{padding:16px 18px}
.hubc{width:340px;height:340px;border-radius:50%;border:2px solid var(--son);background:var(--cham-deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;padding:22px;position:relative;justify-self:center}
.hubc b{font:800 26px/1.1 var(--display)}
.hubc span{font:600 12px var(--mono);letter-spacing:.06em;color:var(--vai-3);text-transform:uppercase}
.hubc::after{content:"";position:absolute;inset:-11px;border:1px dashed var(--cham-3);border-radius:50%}

/* ---------- 14 · compose ---------- */
.compose{display:grid;grid-template-rows:1fr 1.1fr 1fr;gap:14px;flex:1;min-height:0}
.crow{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:stretch;min-height:0}
.rlbl{align-self:center;text-align:right;font:600 11px/1.5 var(--mono);letter-spacing:.12em;color:var(--vai-3);text-transform:uppercase}
.rgrid{display:grid;gap:12px;min-height:0}
.rgrid .node{justify-content:center;padding:16px 16px}
.compose .node{padding:16px 14px}
.compose .node b{font-size:17px}
.compose .node span{font-size:11px;letter-spacing:.04em}
.ports{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
.ports .kv>*{padding:7px 0}
.ports .kv{font-size:19px}
.ports .kv b{font-size:17px}

/* ---------- 15 · bảng ---------- */
table.matrix{font-size:20px;width:100%;table-layout:fixed}
table.matrix td{padding-block:8px;vertical-align:top}
table.matrix td:first-child{font-weight:600;width:41%}
table.matrix td:last-child{font-family:var(--mono);font-size:16px;color:var(--vai-2);letter-spacing:0}
.ok{color:var(--si);font-weight:600;margin-right:6px}

/* ---------- 16 · nộp bài ---------- */
.deliv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.deliv .card{background:var(--cham-2);padding:14px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.deliv .card b{font:600 21px/1.2 var(--display)}
.deliv .chk{font:600 12px var(--mono);letter-spacing:.05em;color:var(--si);text-transform:uppercase}
.deliv .card span{font-size:17px;line-height:1.3;color:var(--vai-2)}
.deliv .path{font:600 13.5px/1.4 var(--mono);color:var(--vai);letter-spacing:0;margin-top:auto;padding-top:6px;border-top:1px solid var(--cham-3);word-break:break-all}
.kv.tight{font-size:19px}
.kv.tight>*{padding:6px 0}
.kv.tight b{font-size:15px}

/* ---------- 17 · quyết định ---------- */
.dec{display:flex;flex-direction:column;gap:8px;padding:20px 20px 22px;background:var(--cham-2);border-top:5px solid var(--son)}
.dec:nth-child(2){border-top-color:var(--nghe)}
.dec:nth-child(3){border-top-color:var(--si)}
.dec .num{font:800 40px/1 var(--display);color:var(--son)}
.dec:nth-child(2) .num{color:var(--nghe)}
.dec:nth-child(3) .num{color:var(--si)}
.dec h3{font-size:24px;line-height:1.2}
.dec p{font-size:19px;line-height:1.35;color:var(--vai-2)}
.dec .ev{margin-top:4px;padding:9px 11px;min-height:64px;border:1px dashed var(--cham-3);background:var(--cham)}
.dec .ev .lbl{display:block;font-size:10px;margin-bottom:3px}
.dec .ev code{font:600 13px/1.35 var(--mono);color:var(--vai);word-break:break-word}
.dec .trade{padding-top:3px}
.dec .trade .lbl{display:block;font-size:10px;margin-bottom:2px}
.dec .trade p{font-size:16px;line-height:1.35;color:var(--vai-3)}
.dec .ticks{margin-top:auto;padding-top:12px;border-top:1px solid var(--cham-3)}
.dec .chain{margin-top:auto}
.dec .chain b{font-size:15px;padding:9px 6px}
.dec .chain i{width:14px}
.dec .ticks li{font-size:18px;color:var(--vai-2)}

/* ---------- 18 · kết ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpis .node{padding:16px 18px}
.kpis .node b{font:800 46px/1 var(--display);color:var(--son)}
.kpis .node span{font-size:12px}
.closing{flex:1;display:grid;grid-template-columns:1fr 430px;gap:52px;align-items:stretch;min-height:0}
.repo{font:600 19px/1.5 var(--mono);color:var(--vai-2);word-break:break-all}
.repo b{display:block;font:600 13px var(--mono);letter-spacing:.08em;color:var(--vai-3);text-transform:uppercase;margin-bottom:4px}

/* ---------- dải ghi chú ---------- */
.strip{background:var(--cham-2);border-left:6px solid var(--nghe);padding:10px 16px;font-size:20px;line-height:1.35;display:flex;gap:12px;align-items:baseline}
.strip b{font:600 14px var(--mono);letter-spacing:.06em;color:var(--nghe);text-transform:uppercase;flex:0 0 auto}
.strip.son{border-left-color:var(--son)}
.strip.son b{color:var(--son)}
.strip.si{border-left-color:var(--si)}
.strip.si b{color:var(--si)}

/* ===== editor.css.part ===== */
/* PRN ASM editor — bảng chỉnh sửa theo bản vẽ giấy (giữ nguyên cơ chế của editor.js) */
#prn-editor-toggle{position:fixed;right:22px;top:15px;z-index:8001;display:flex;align-items:center;gap:9px;border:1.5px solid var(--vai);color:var(--vai);background:var(--cham);border-radius:2px;font:600 13px var(--mono);letter-spacing:.06em;padding:10px 16px;box-shadow:4px 4px 0 var(--cham-3);cursor:pointer;text-transform:uppercase}
#prn-editor-toggle:hover{background:var(--cham-2)}
#prn-editor-toggle.prn-on{background:var(--nghe);border-color:var(--nghe);color:var(--on-nghe);box-shadow:4px 4px 0 var(--cham-3)}
#prn-editor-panel{position:fixed;right:12px;top:62px;bottom:86px;width:360px;overflow:auto;z-index:8000;border:1.5px solid var(--vai);background:var(--cham);box-shadow:-6px 0 0 var(--cham-2);color:var(--vai);padding:16px 18px 20px;font-family:var(--body);display:none;user-select:text}
#prn-editor-panel *{box-sizing:border-box}
#prn-editor-panel h3{font:600 20px var(--display);margin:2px 0 10px;letter-spacing:0}
#prn-editor-panel h4{font:600 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--nghe);margin:18px 0 8px;border-top:1px solid var(--cham-3);padding-top:14px}
#prn-editor-panel p{font-size:13px;line-height:1.55;color:var(--vai-2);margin:6px 0 12px}
#prn-editor-panel button{cursor:pointer;border:1.5px solid var(--cham-3);background:var(--cham);color:var(--vai);padding:9px 10px;border-radius:2px;font:600 12px var(--mono);letter-spacing:.03em;white-space:normal}
#prn-editor-panel button:hover{background:var(--cham-2);border-color:var(--vai-3)}
#prn-editor-panel button.prn-primary{background:var(--son);border-color:var(--son);color:var(--on-son)}
#prn-editor-panel button.prn-danger{background:transparent;border-color:var(--nghe);color:var(--nghe)}
.prn-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.prn-buttons.full{grid-template-columns:1fr}
.prn-grid-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prn-field{display:flex;flex-direction:column;gap:5px;font-size:12px;margin:10px 0}
.prn-field span{font:600 11px var(--mono);letter-spacing:.06em;color:var(--vai-3);text-transform:uppercase}
.prn-field input,.prn-field select,.prn-field textarea{min-width:0;width:100%;border:1.5px solid var(--cham-3);border-radius:2px;padding:8px;background:var(--cham-deep);color:var(--vai);font:400 13px var(--body);outline:none}
.prn-field textarea{resize:vertical;line-height:1.4;min-height:76px}
.prn-field input[type=color]{height:38px;padding:3px;cursor:pointer}
.prn-field input:focus,.prn-field select:focus,.prn-field textarea:focus{border-color:var(--son)}
.prn-badge{display:inline-flex;color:var(--vai-2);background:var(--cham-2);border:1px solid var(--cham-3);padding:4px 8px;font:600 11px var(--mono);letter-spacing:.04em}
.prn-rule{height:1px;background:var(--cham-3);margin:15px 0}
.prn-alert{background:var(--cham-2);border-left:4px solid var(--si);padding:9px 11px;font-size:11.5px;line-height:1.5;color:var(--vai-2);margin-top:11px}
.prn-selected-note{color:var(--son)!important}
.prn-hotkeys{display:flex;justify-content:space-between;gap:8px;font:600 11px var(--mono);color:var(--vai-3);margin-top:12px}
.prn-shortcut{border:1px solid var(--cham-3);padding:2px 5px;color:var(--vai-2)}
.prn-upload-hidden{display:none!important}
.prn-editing #prn-editor-panel{display:block}
.prn-editing #prn-editor-toggle{right:381px;background:var(--nghe);border-color:var(--nghe);color:var(--on-nghe)}
.prn-editing .presentation-shell .stage{left:calc((100% - 386px)/2) !important;top:50% !important;transform:translate(-50%,-50%) scale(var(--prn-editor-stage-scale,0.72)) !important}
.prn-editing .slide-canvas .r{animation:none!important}
.prn-editing .app-bottom{right:386px}
.prn-editing .prn-edit-target{outline:1px dashed transparent;outline-offset:3px;cursor:text;user-select:text!important;min-width:3px}
.prn-editing .prn-edit-target:hover{outline-color:var(--nghe);background:color-mix(in srgb,var(--nghe) 8%,transparent)}
.prn-editing .prn-edit-target:focus{outline:2px solid var(--son)!important;background:var(--cham-deep);border-radius:1px;cursor:text}
.prn-editing .presentation-shell{user-select:text}
.prn-overlay-object{position:absolute;z-index:30;border:1.5px solid transparent;overflow:visible;touch-action:none;box-sizing:border-box;user-select:none}
.prn-overlay-object img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.prn-overlay-object.prn-kind-image{background:color-mix(in srgb,var(--cham) 55%,transparent)}
.prn-overlay-object.prn-kind-text{background:var(--cham-deep);border:1.5px solid var(--vai);padding:14px 18px;display:flex;align-items:center;justify-content:center}
.prn-text-body{width:100%;white-space:pre-wrap;text-align:center;word-break:break-word;line-height:1.27;font-weight:600;pointer-events:none}
.prn-overlay-object.prn-kind-diagram{padding:18px 20px;background:var(--cham-deep);border:1.5px solid var(--si)}
.prn-diagram-layout{display:flex;align-items:center;justify-content:space-around;gap:6px;width:100%;height:100%}
.prn-diagram-node{flex:1;padding:12px 8px;text-align:center;color:var(--vai);background:var(--cham-2);border:1.5px solid var(--cham-3);font:600 17px/1.3 var(--body);white-space:pre-wrap;overflow-wrap:anywhere;max-height:calc(100% - 8px);overflow:hidden}
.prn-diagram-arrow{color:var(--nghe);font-size:22px;flex:0 0 24px;text-align:center}
.prn-object-grip{position:absolute;top:-22px;left:0;background:var(--son);color:var(--on-son);font:600 11px var(--mono);letter-spacing:.04em;padding:3px 10px;display:none;cursor:grab;white-space:nowrap}
.prn-object-resizer{position:absolute;bottom:-7px;right:-7px;width:17px;height:17px;background:var(--nghe);border:2px solid var(--cham);cursor:nwse-resize;display:none}
.prn-editing .prn-overlay-object{cursor:grab}
.prn-editing .prn-overlay-object:hover{border-color:var(--nghe)}
.prn-editing .prn-overlay-object.prn-selected{border:2px solid var(--son);box-shadow:0 0 0 3px color-mix(in srgb,var(--son) 22%,transparent),0 10px 26px rgba(10,14,24,.18)}
.prn-editing .prn-overlay-object.prn-selected .prn-object-grip,.prn-editing .prn-overlay-object.prn-selected .prn-object-resizer{display:block}
#prn-notice{position:fixed;left:50%;bottom:74px;z-index:99999;transform:translateX(-50%);border:1.5px solid var(--vai);background:var(--cham);color:var(--vai);padding:10px 18px;font:600 13px var(--mono);box-shadow:4px 4px 0 var(--cham-3);display:none;max-width:min(92vw,760px);text-align:center}
#prn-notice.prn-on{display:block}
@media(max-width:760px){#prn-editor-panel{left:8px;right:8px;width:auto;top:auto;bottom:65px;height:38vh;padding:11px}#prn-editor-toggle{right:8px;top:9px;padding:9px}.prn-editing #prn-editor-toggle{right:8px}.prn-editing .presentation-shell .stage{left:50%!important;top:calc((100% - 38vh - 65px)/2)!important}.prn-editing .app-bottom{right:0}}
</style>

<script id="prn-slides">
/* PRN ASM — 18 tờ trình chiếu theo rubric PRN232 Final Assignment.
   Nội dung: mục lục, mục tiêu, kiến trúc (C4 container) + ERD, REST API,
   background job, Kafka, gRPC, JWT, deploy Docker, yêu cầu kỹ thuật,
   sản phẩm nộp, ghi chú.
   Giao diện: "Bản vẽ kỹ thuật động" — giấy kẻ ô, mực cobalt, nhãn mono. */
(function(){
'use strict';
const R=window.React, RD=window.ReactDOM;
const h=R.createElement;
const TOTAL=18;
const div=(p,...c)=>h('div',p,...c);
const span=(p,...c)=>h('span',p,...c);

/* ---------------- khối dùng chung ---------------- */
function Frame(props){
  const {tag='HÌNH',cap='',children,style,className=''} = props;
  return h('figure',{className:'fig '+className,style},
    span({className:'tick tl'}),span({className:'tick tr'}),
    span({className:'tick bl'}),span({className:'tick br'}),
    div({className:'body'},children),
    h('figcaption',{className:'cap'},span(null,h('b',null,tag)),span(null,cap))
  );
}
const Node=(props)=>{
  const {t,s,tone='',style,children}=props;
  return div({className:'node '+tone,style},h('b',null,t),s?span(null,s):null,children||null);
};
const VLine=({label})=>div({className:'vline'},span(null,label||''));
const Harrow=()=>span({className:'harrow'},'→');
const Strip=({k,tone='',children})=>div({className:'strip '+tone},h('b',null,k),div(null,children));

function Thread({i}){
  return div({className:'thread'},...Array.from({length:TOTAL},(_,k)=>
    h('i',{key:k,className:(k<i?'done':k===i?'now':'')})));
}
function Shell({n,eb,title,children,note,className=''}){
  return div({className:'slide-inner '+className},
    div({className:'eb r'},h('i'),eb),
    h('h2',{className:'r',style:{'--i':1}},title),
    children,
    div({className:'pg'},String(n).padStart(2,'0'),h('small',null,' / '+TOTAL)),
    h(Thread,{i:n-1}),
    div({className:'foot'},
      h('b',null,'PRN232'),
      span({className:'dot'},'·'),
      span(null,note||'Sudoku Online · .NET 8'),
      span({style:{marginLeft:'auto'}},'PRN_ASM · Nhóm 4')
    )
  );
}

/* ---------------- dữ liệu ---------------- */
const MEMBERS=[['Nguyễn Duy Phong','SE192969'],['Phạm Gia Huy','SE192867'],['Mai Tuấn Vỹ','SE194261'],['Nguyễn Tuấn Kiệt','SE192837']];
const PUZZLE=[
 [5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],
 [8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],
 [0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]
];
function Board(){
  return div({className:'sudoku'},...PUZZLE.flatMap((row,r)=>row.map((v,c)=>{
    const cls=[];
    if(c%3===2&&c<8)cls.push('bR');
    if(r%3===2&&r<8)cls.push('bB');
    if(v)cls.push('given');
    if(r===4&&c===4)cls.push('focus');
    return span({key:r*9+c,className:cls.join(' ')},v?String(v):'');
  })));
}
const WORKERS=[
 ['2 giây','OutboxProcessorWorker','Quét OutboxMessage chưa gửi, publish lên Kafka rồi đánh dấu đã xử lý.','Game.Api + Multiplayer.Api · Messaging/'],
 ['60 giây','PuzzleReplenishWorker','Giữ tối thiểu 15 puzzle chưa chơi cho mỗi cấp độ đang mở để không cạn đề.','Game.Api · khởi động chờ 10 giây'],
 ['1 giây','MatchLifecycleWorker','Quét phòng 1v1 đang chạy: hết giờ chuẩn bị, quá hạn, chốt trận và phát kết quả.','Multiplayer.Api · Redis runtime store']

const uiIcon={left:'←',right:'→',full:'⤢',grid:'▦',help:'?',notes:'N'};
class Presentation extends R.Component{
  constructor(p){
    super(p);
    const hash=Number(location.hash.replace('#',''));
    this.state={index:Number.isFinite(hash)&&hash>=1&&hash<=TOTAL?hash-1:0,overview:false,help:false,notes:false,scale:1};
    this.touchStart=null;this.lastWheel=0;
    this.keyHandler=this.handleKey.bind(this);this.resizer=this.resize.bind(this);this.wheeler=this.wheel.bind(this);
  }
  componentDidMount(){
    window.addEventListener('keydown',this.keyHandler);
    window.addEventListener('resize',this.resizer);
    window.addEventListener('wheel',this.wheeler,{passive:false});
    this.hashHandler=()=>{const n=Number(location.hash.slice(1));if(n>=1&&n<=TOTAL)this.setState({index:n-1});};
    window.addEventListener('hashchange',this.hashHandler);
    this.resize();
  }
  componentWillUnmount(){
    window.removeEventListener('keydown',this.keyHandler);
    window.removeEventListener('resize',this.resizer);
    window.removeEventListener('wheel',this.wheeler);
    window.removeEventListener('hashchange',this.hashHandler);
  }
  resize(){this.setState({scale:Math.min(window.innerWidth/1600,window.innerHeight/900)});}
  go(delta){
    this.setState(s=>{
      const index=Math.max(0,Math.min(TOTAL-1,s.index+delta));
      if(index!==s.index)window.history.replaceState(null,'','#'+(index+1));
      return {index,overview:false,help:false};
    });
  }
  goto(index){window.history.replaceState(null,'','#'+(index+1));this.setState({index,overview:false,help:false});}
  theme(){
    const order=['giay','reu','cham'];
    const now=document.documentElement.dataset.look||'giay';
    const next=order[(order.indexOf(now)+1)%order.length];
    if(next==='giay')delete document.documentElement.dataset.look;else document.documentElement.dataset.look=next;
  }
  handleKey(e){
    const tag=document.activeElement?.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||document.activeElement?.isContentEditable)return;
    const k=e.key;
    if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(k)){e.preventDefault();this.go(1);}
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();this.go(-1);}
    else if(k==='Home')this.goto(0);
    else if(k==='End')this.goto(TOTAL-1);
    else if(k.toLowerCase()==='o')this.setState(s=>({overview:!s.overview,help:false}));
    else if(k.toLowerCase()==='n')this.setState(s=>({notes:!s.notes}));
    else if(k.toLowerCase()==='d')this.theme();
    else if(k.toLowerCase()==='f')this.fullscreen();
    else if(k==='?'||k.toLowerCase()==='h')this.setState(s=>({help:!s.help,overview:false}));
    else if(k==='Escape')this.setState({help:false,overview:false,notes:false});
  }
  wheel(e){
    if(Math.abs(e.deltaY)<18||this.state.overview)return;
    const t=Date.now();if(t-this.lastWheel<650)return;this.lastWheel=t;this.go(e.deltaY>0?1:-1);
  }
  fullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
  render(){
    const {index,scale,overview,help,notes}=this.state;
    const Active=slides[index];
    return div({className:'presentation-shell',
      onTouchStart:ev=>{this.touchStart={x:ev.touches[0].clientX,y:ev.touches[0].clientY};},
      onTouchEnd:ev=>{if(!this.touchStart)return;const dx=ev.changedTouches[0].clientX-this.touchStart.x;if(Math.abs(dx)>75)this.go(dx<0?1:-1);this.touchStart=null;}},
      div({className:'stage',style:{transform:`translate(-50%,-50%) scale(${scale})`}},
        div({className:'slide-canvas',key:index},h(Active,{}))),
      div({className:'app-topline'},span({className:'live-dot'}),span(null,'PRN ASM'),span({className:'app-divider'}),span(null,'Sudoku Online')),
      div({className:'app-bottom'},
        div({className:'nav-controls'},

          div({className:'slide-picker'},...slideTitles.map((name,i)=>

      help?div({className:'modal-backdrop',onClick:()=>this.setState({help:false})},
        div({className:'help-modal',onClick:ev=>ev.stopPropagation()},
          div({className:'modal-head'},h('b',null,'Điều khiển trình chiếu'),h('button',{onClick:()=>this.setState({help:false})},'×')),
          div({className:'help-list'},...[['→ / Space','Tờ tiếp theo'],['← / Backspace','Tờ trước'],['Home / End','Đầu / cuối'],
            ['N','Ghi chú người nói'],['O','Xem tất cả 18 tờ'],['D','Đổi kiểu màu (giấy · rêu · chàm)'],
            ['F','Toàn màn hình'],['Esc','Đóng bảng này']].map(([k,v],i)=>
            div({className:'help-row',key:i},span({className:'keycap'},k),span(null,v)))))):null
    );
  }
}
RD.render(h(Presentation),document.getElementById('root'));
})();

<script id="prn-baked-state" type="application/json">{"version":2,"slides":[{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]},{"texts":{},"objects":[]}]}</script>
<script id="prn-slide-editor">
(() => {
  'use strict';
  const COUNT = 18;
  const STORE = 'prn-asm-slide-editor-state-v2';
  const embedded = document.getElementById('prn-baked-state');
  let state = {version:2, slides:Array.from({length:COUNT},()=>({texts:{},objects:[]})), updatedAt:null};
  const readState = value => {
    if (!value || typeof value !== 'object' || !Array.isArray(value.slides) || value.slides.length !== COUNT) throw new Error('Tệp dữ liệu phải có chính xác '+COUNT+' slide');
    return {version:2,slides:value.slides.map(s=>({texts:s.texts && typeof s.texts==='object'?s.texts:{},objects:Array.isArray(s.objects)?s.objects:[]})),updatedAt:value.updatedAt||null};
  };
  try { if(embedded && embedded.textContent.trim()) state=readState(JSON.parse(embedded.textContent)); }catch(err){console.warn('Embedded state ignored',err);}
  try { const s=localStorage.getItem(STORE); if(s) state=readState(JSON.parse(s)); }catch(err){console.warn('Local editor state unavailable',err);}
  let editing=false, selected=null, selectedElement=null, slideIndex=0, noticeTimer=0, activeSlide=null, applyScheduled=false, hasDraftWarning=false;
  const $ = (sel,ctx=document)=>ctx.querySelector(sel);
  const el = (tag,attrs={},textValue)=>{const v=document.createElement(tag);for(const [k,value] of Object.entries(attrs)){if(k==='className')v.className=value;else if(k==='dataset')for(const [x,z] of Object.entries(value))v.dataset[x]=z;else v.setAttribute(k,value);}if(textValue!==undefined)v.textContent=textValue;return v;};
  const safeHTML = text => String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const getSlide = () => $('.slide-inner');
  const getCurrent = () => Math.max(0,Math.min(COUNT-1,(Number(location.hash.replace('#',''))||1)-1));
  const newId = () => 'obj-'+Math.random().toString(36).slice(2,11);
  const toast = msg =>{const n=$('#prn-notice');n.textContent=msg;n.classList.add('prn-on');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.classList.remove('prn-on'),3400);};
  const store = () => {state.updatedAt=new Date().toISOString();try{localStorage.setItem(STORE,JSON.stringify(state));hasDraftWarning=false;}catch(err){if(!hasDraftWarning){toast('Bộ nhớ trình duyệt đã đầy. Hãy xuất JSON hoặc HTML để tránh mất dữ liệu.');hasDraftWarning=true;}console.warn(err);}};
  function keyFor(node,root){let parts=[];while(node&&node!==root){let p=node.parentElement;if(!p)return null;parts.unshift(Array.prototype.indexOf.call(p.children,node));node=p;}return node===root?parts.join('.'):null;}
  const editableTags='h1,h2,h3,h4,h5,p,span,strong,b,small,li,td,th,figcaption,.eb,.cap,.kicker,.slide-title,.lbl,.tag,.big,.num,.iv,.v,.t,.a,.b,.thumb-n,.repo,.chip,.node,.strip,.kpi,.member,.row';
  function candidates(root){
    if(!root)return [];
    const picks=new Set();
    const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    while(tw.nextNode()){
      const n=tw.currentNode, v=(n.textContent||'').trim();if(!v)continue;
      const parent=n.parentElement;if(!parent||parent.closest('svg,script,style,.sudoku-grid,.prn-overlay-object,.prn-object-grip'))continue;
      if(parent.closest('button,a'))continue;
      let target=parent;
      // Direct text-bearing nodes are safer than editing a whole container with nested child blocks.
      if(!target.matches(editableTags)&&target.children.length>0)continue;
      if(target.childElementCount && target.querySelector('svg,img,button,canvas'))continue;
      picks.add(target);
    }
    return Array.from(picks);
  }
  function patchText(root,i){
    for(const node of candidates(root)){
      const key=keyFor(node,root);if(!key)continue;
      node.dataset.prnTextKey=key;
      const p=state.slides[i].texts[key];if(p){
        if(typeof p.html==='string')node.innerHTML=p.html;
        if(typeof p.style==='string')node.style.cssText=p.style;
      }
      if(editing){node.classList.add('prn-edit-target');node.setAttribute('contenteditable','plaintext-only');node.spellcheck=false;}
      else{node.classList.remove('prn-edit-target');node.removeAttribute('contenteditable');}
    }
  }
  function makeDiagram(node,obj){
    const items=Array.isArray(obj.nodes)?obj.nodes:['Bắt đầu','Xử lý','Kết thúc'];node.replaceChildren();
    const wrap=el('div',{className:'prn-diagram-layout'});
    items.slice(0,7).forEach((t,i)=>{if(i)wrap.append(el('span',{className:'prn-diagram-arrow'},'→'));wrap.append(el('div',{className:'prn-diagram-node'},t));});
    node.append(wrap);
  }
  function drawObjects(root,i){
    root.querySelectorAll('.prn-overlay-object').forEach(n=>n.remove());
    for(const object of state.slides[i].objects){
      const n=el('div',{className:'prn-overlay-object prn-kind-'+object.kind,dataset:{prnId:object.id}});
      n.style.left=object.x+'px';n.style.top=object.y+'px';n.style.width=object.w+'px';n.style.height=object.h+'px';
      if(object.kind==='image'){
        const img=el('img',{alt:object.name||'User added image'});img.src=object.src||'';n.append(img);
      }else if(object.kind==='text'){
        const text=el('div',{className:'prn-text-body'},object.text||'');text.style.fontSize=(object.fontSize||32)+'px';text.style.color=object.color||'#141e2b';text.style.fontFamily=object.fontFamily||'"Be Vietnam Pro", "Segoe UI", Arial, sans-serif';text.style.fontWeight=object.bold===false?'400':'700';n.append(text);
      }else if(object.kind==='diagram'){makeDiagram(n,object);}
      const grip=el('div',{className:'prn-object-grip'},object.kind==='image'?'Ảnh · kéo thả':object.kind==='diagram'?'Diagram · kéo thả':'Chữ · kéo thả');
      const resize=el('div',{className:'prn-object-resizer',title:'Kéo để đổi kích thước'});
      n.append(grip,resize);
      n.classList.toggle('prn-selected',!!selected&&selected.id===object.id&&i===slideIndex&&editing);
      n.addEventListener('pointerdown',event=>{if(!editing)return;selectObject(object.id);event.preventDefault();event.stopPropagation();startDrag(event,object,n,event.target===resize?'resize':'move');});
      root.append(n);
    }
  }
  function updateScale(){if(!editing)return;const root=document.documentElement;let x=Math.min(Math.max(130,innerWidth-380)/1600,Math.max(170,innerHeight-100)/900);root.style.setProperty('--prn-editor-stage-scale',String(x));}
  function refreshSlide(){
    let root=getSlide();if(!root)return;
    const canvas=$('.slide-canvas');
    // React owns the outer slide DOM; only apply on a new rendered slide or when specifically requested.
    const nextIndex=getCurrent();if(activeSlide!==canvas || slideIndex!==nextIndex){selected=null;selectedElement=null;slideIndex=nextIndex;activeSlide=canvas;}
    patchText(root,slideIndex);
    drawObjects(root,slideIndex);
    refreshPanel();
  }
  function scheduleRefresh(){if(applyScheduled)return;applyScheduled=true;requestAnimationFrame(()=>{applyScheduled=false;refreshSlide();});}
  function selectObject(id){selected={id};selectedElement=null;refreshPanel();let root=getSlide();root?.querySelectorAll('.prn-overlay-object').forEach(n=>n.classList.toggle('prn-selected',n.dataset.prnId===id));}
  function findObject(){return selected?state.slides[slideIndex].objects.find(x=>x.id===selected.id):null;}
  function startDrag(event,obj,node,mode){
    const scale=node.getBoundingClientRect().width/(obj.w||1)||1;
    const x=event.clientX,y=event.clientY,ix=obj.x,iy=obj.y,iw=obj.w,ih=obj.h;
    const move=e=>{const dx=(e.clientX-x)/scale,dy=(e.clientY-y)/scale;
      if(mode==='resize'){
        obj.w=Math.max(100,Math.round(iw+dx));obj.h=Math.max(70,Math.round(ih+dy));node.style.width=obj.w+'px';node.style.height=obj.h+'px';
      }else{
        obj.x=Math.round(Math.max(-obj.w+40,Math.min(1560,ix+dx)));obj.y=Math.round(Math.max(-obj.h+40,Math.min(860,iy+dy)));
        node.style.left=obj.x+'px';node.style.top=obj.y+'px';
      }
      updatePropsFields();
    };
    const stop=()=>{document.removeEventListener('pointermove',move,true);document.removeEventListener('pointerup',stop,true);store();};
    document.addEventListener('pointermove',move,true);document.addEventListener('pointerup',stop,true);
  }
  const tb=el('button',{id:'prn-editor-toggle',type:'button'},'✎  Chỉnh sửa');
  const panel=el('aside',{id:'prn-editor-panel','aria-label':'Bảng chỉnh sửa slide'});
  panel.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between"><h3>✦ PRN ASM Editor</h3><span class="prn-badge" id="prn-slide-indicator">Slide 01 / ${COUNT}</span></div>
    <p>Nhấp vào chữ trên slide để sửa trực tiếp. Nhấp vào đối tượng để kéo thả, định dạng hoặc thay kích thước.</p>
    <h4>Chèn nội dung</h4>
    <div class="prn-buttons"><button type="button" id="prn-add-text">＋ Hộp chữ</button><button type="button" id="prn-add-image">＋ Ảnh / logo</button><button type="button" id="prn-add-diagram">＋ Diagram</button><button type="button" id="prn-duplicate-object">⧉ Nhân đôi</button></div>
    <input id="prn-image-file" class="prn-upload-hidden" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/gif" />
    <div class="prn-rule"></div>
    <div id="prn-object-props"><span class="prn-badge">Chưa chọn đối tượng</span><p>Để chỉnh font, màu chữ: nhấp vào chữ của slide, rồi sử dụng các thuộc tính bên dưới.</p></div>
    <h4>Lưu và chia sẻ</h4>
    <div class="prn-buttons"><button class="prn-primary" id="prn-save-local">✓ Lưu trên máy</button><button id="prn-export-html">⬇ Xuất HTML</button><button id="prn-export-json">⬇ Xuất JSON</button><button id="prn-import-json">⬆ Nhập JSON</button></div>
    <input id="prn-json-file" class="prn-upload-hidden" type="file" accept="application/json,.json" />
    <div class="prn-alert"><b>Lưu ý về chia sẻ nhóm:</b> GitHub Pages cho phép mọi người mở và chỉnh sửa bản riêng trên trình duyệt; các thay đổi KHÔNG tự đồng bộ. Muốn nhóm thấy bản mới, hãy xuất HTML rồi cập nhật <code>index.html</code> trên GitHub; hoặc trao đổi tệp JSON để nhập thay đổi.</div>
    <div class="prn-buttons full" style="margin-top:10px"><button id="prn-reset-slide" class="prn-danger">↺ Khôi phục thay đổi slide hiện tại</button></div>
    <div class="prn-hotkeys"><span><span class="prn-shortcut">Esc</span> Bỏ chọn</span><span><span class="prn-shortcut">Delete</span> Xóa đối tượng</span></div>
  `;
  const notice=el('div',{id:'prn-notice',role:'status','aria-live':'polite'});
  document.body.append(tb,panel,notice);
  const props=$('#prn-object-props');
  const inputLine=(name,value,type='text')=>`<label class="prn-field"><span>${name}</span><input data-prn-prop="${safeHTML(name)}" type="${type}" value="${safeHTML(value)}"></label>`;
  function refreshPanel(){
    $('#prn-slide-indicator').textContent='Slide '+String(slideIndex+1).padStart(2,'0')+' / '+COUNT;
    const obj=findObject();
    if(selectedElement && editing){
      props.innerHTML=`<span class="prn-badge">Đang chỉnh chữ gốc</span>
        <div class="prn-field"><span>Font chữ</span><select id="prn-font"><option value="&quot;Bricolage Grotesque&quot;, &quot;Be Vietnam Pro&quot;, &quot;Segoe UI&quot;, sans-serif">Bricolage Grotesque (tiêu đề)</option><option value="&quot;Be Vietnam Pro&quot;, &quot;Segoe UI&quot;, Arial, sans-serif">Be Vietnam Pro (thân)</option><option value="&quot;IBM Plex Mono&quot;, Consolas, monospace">IBM Plex Mono (nhãn)</option><option value="Georgia, serif">Georgia</option></select></div>
        <div class="prn-grid-row"><label class="prn-field"><span>Cỡ chữ (px)</span><input id="prn-font-size" type="number" min="10" max="210" value="${parseInt(getComputedStyle(selectedElement).fontSize)||30}"></label><label class="prn-field"><span>Màu</span><input id="prn-font-color" type="color" value="${rgbToHex(getComputedStyle(selectedElement).color)}"></label></div>
        <div class="prn-buttons"><button id="prn-bold-text">Bật/tắt in đậm</button><button id="prn-center-text">Căn giữa</button></div>
        <p class="prn-selected-note">Sửa nội dung ngay trên slide; các thay đổi được lưu cục bộ tự động.</p>`;
      $('#prn-font').value=selectedElement.style.fontFamily||'"Bricolage Grotesque", "Be Vietnam Pro", "Segoe UI", sans-serif';
      const changeStyle=()=>{const k=selectedElement.dataset.prnTextKey;if(!k)return;state.slides[slideIndex].texts[k]={html:selectedElement.innerHTML,style:selectedElement.style.cssText};store();};
      $('#prn-font').onchange=e=>{selectedElement.style.fontFamily=e.target.value;changeStyle();};
      $('#prn-font-size').onchange=e=>{selectedElement.style.fontSize=Math.max(10,Math.min(210,Number(e.target.value)||30))+'px';changeStyle();};
      $('#prn-font-color').onchange=e=>{selectedElement.style.color=e.target.value;changeStyle();};
      $('#prn-bold-text').onclick=()=>{selectedElement.style.fontWeight=getComputedStyle(selectedElement).fontWeight==='700'?'400':'700';changeStyle();};
      $('#prn-center-text').onclick=()=>{selectedElement.style.textAlign='center';changeStyle();};
    }else if(obj){
      props.innerHTML=`<span class="prn-badge">Đã chọn ${obj.kind==='image'?'hình ảnh':obj.kind==='diagram'?'diagram':'hộp chữ'}</span>
        <div class="prn-grid-row">${inputLine('X',obj.x,'number')}${inputLine('Y',obj.y,'number')}${inputLine('Rộng',obj.w,'number')}${inputLine('Cao',obj.h,'number')}</div>
        ${obj.kind==='text'?`<label class="prn-field"><span>Nội dung hộp chữ</span><textarea id="prn-object-text">${safeHTML(obj.text||'')}</textarea></label><div class="prn-grid-row">${inputLine('Cỡ chữ',obj.fontSize||32,'number')}<label class="prn-field"><span>Màu</span><input type="color" id="prn-object-color" value="${safeHTML(obj.color||'#141e2b')}"></label></div><label class="prn-field"><span>Font</span><select id="prn-object-family"><option value="&quot;Bricolage Grotesque&quot;, &quot;Be Vietnam Pro&quot;, &quot;Segoe UI&quot;, sans-serif">Bricolage Grotesque</option><option value="&quot;Be Vietnam Pro&quot;, &quot;Segoe UI&quot;, Arial, sans-serif">Be Vietnam Pro</option><option value="&quot;IBM Plex Mono&quot;, Consolas, monospace">IBM Plex Mono</option><option value="Georgia, serif">Georgia</option></select></label>`:''}
        ${obj.kind==='diagram'?`<label class="prn-field"><span>Các ô diagram (mỗi dòng một ô)</span><textarea rows="6" id="prn-diagram-nodes">${safeHTML((obj.nodes||[]).join('\n'))}</textarea></label>`:''}
        <div class="prn-buttons"><button class="prn-danger" id="prn-delete-object">✕ Xóa đối tượng</button></div>`;
      props.querySelectorAll('[data-prn-prop]').forEach(inp=>inp.onchange=e=>{const key=({'X':'x','Y':'y','Rộng':'w','Cao':'h','Cỡ chữ':'fontSize'})[e.target.dataset.prnProp];if(!key)return;obj[key]=Number(e.target.value)||0;if(key==='w'||key==='h')obj[key]=Math.max(80,obj[key]);store();drawObjects(getSlide(),slideIndex);});
      const ta=$('#prn-object-text');if(ta)ta.oninput=e=>{obj.text=e.target.value;store();drawObjects(getSlide(),slideIndex)};
      const co=$('#prn-object-color');if(co)co.oninput=e=>{obj.color=e.target.value;store();drawObjects(getSlide(),slideIndex)};
      const fam=$('#prn-object-family');if(fam){fam.value=obj.fontFamily||'"Be Vietnam Pro", "Segoe UI", Arial, sans-serif';fam.onchange=e=>{obj.fontFamily=e.target.value;store();drawObjects(getSlide(),slideIndex)}}
      const nd=$('#prn-diagram-nodes');if(nd)nd.oninput=e=>{obj.nodes=e.target.value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,7);store();drawObjects(getSlide(),slideIndex)};
      $('#prn-delete-object').onclick=()=>removeSelected();
    }else{
      props.innerHTML='<span class="prn-badge">Chưa chọn đối tượng</span><p>Nhấp vào chữ để thay font, cỡ chữ và màu. Nhấp ảnh/diagram để kéo thả hoặc thay kích thước.</p>';
    }
  }
  function rgbToHex(color){if(/^#[0-9a-f]{6}$/i.test(color))return color;const nums=(color.match(/\d+/g)||[]).slice(0,3).map(x=>Math.max(0,Math.min(255,+x)));return nums.length===3?'#'+nums.map(n=>n.toString(16).padStart(2,'0')).join(''):'#ffffff';}
  function removeSelected(){const a=state.slides[slideIndex].objects;const idx=a.findIndex(x=>x.id===selected?.id);if(idx>=0){a.splice(idx,1);selected=null;store();drawObjects(getSlide(),slideIndex);refreshPanel();}}
  function addObject(data){const obj={id:newId(),...data};state.slides[slideIndex].objects.push(obj);store();drawObjects(getSlide(),slideIndex);selectObject(obj.id);toast('Đã chèn đối tượng vào slide '+(slideIndex+1));return obj;}
  $('#prn-add-text').onclick=()=>addObject({kind:'text',x:420,y:330,w:570,h:112,text:'Nhập nội dung...',fontSize:38,color:'#141e2b',fontFamily:'"Be Vietnam Pro", "Segoe UI", Arial, sans-serif'});
  $('#prn-add-diagram').onclick=()=>addObject({kind:'diagram',x:150,y:325,w:1260,h:270,nodes:['Bước 1','Bước 2','Bước 3']});
  $('#prn-add-image').onclick=()=>$('#prn-image-file').click();
  $('#prn-image-file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>7*1024*1024){toast('Ảnh lớn hơn 7MB. Hãy nén ảnh trước khi tải lên.');return;}const reader=new FileReader();reader.onload=()=>addObject({kind:'image',x:490,y:300,w:530,h:360,src:String(reader.result),name:f.name});reader.readAsDataURL(f);e.target.value='';};
  $('#prn-duplicate-object').onclick=()=>{const obj=findObject();if(!obj){toast('Hãy chọn một đối tượng trước.');return;}addObject({...obj,id:newId(),x:obj.x+24,y:obj.y+24})};
  $('#prn-save-local').onclick=()=>{store();toast('Đã lưu trên trình duyệt này. Hãy xuất HTML hoặc JSON để gửi cho người khác.');};
  function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=el('a',{href:url,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
  $('#prn-export-json').onclick=()=>{store();download('PRN_ASM_'+COUNT+'_Slides.project.json',JSON.stringify(state,null,2),'application/json');toast('Đã xuất dự án JSON: gửi cho bạn bè để nhập vào cùng bản HTML Editor.');};
  function buildStandalone(){
    const clone=document.documentElement.cloneNode(true);
    const root=clone.querySelector('#root');if(root)root.replaceChildren();
    clone.querySelectorAll('#prn-editor-toggle,#prn-editor-panel,#prn-notice').forEach(n=>n.remove());
    clone.classList.remove('prn-editing');clone.style.removeProperty('--prn-editor-stage-scale');
    const holder=clone.querySelector('#prn-baked-state');if(holder)holder.textContent=JSON.stringify(state).replace(/</g,'\\u003c');
    return '<!doctype html>\n'+clone.outerHTML;
  }
  $('#prn-export-html').onclick=()=>{store();download('index.html',buildStandalone(),'text/html');toast('Đã xuất index.html – có thể đăng GitHub Pages hoặc chia sẻ như một file độc lập.');};
  $('#prn-import-json').onclick=()=>$('#prn-json-file').click();
  $('#prn-json-file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const v=readState(JSON.parse(await f.text()));if(!confirm('Nhập file dự án sẽ thay thế các chỉnh sửa đang lưu trên trình duyệt. Tiếp tục?'))return;state=v;selected=null;selectedElement=null;store();refreshSlide();toast('Đã nhập dự án '+COUNT+' slide.');}catch(err){toast('Không đọc được dự án: '+err.message)}finally{e.target.value='';}};
  $('#prn-reset-slide').onclick=()=>{if(!confirm('Khôi phục toàn bộ thay đổi trên slide '+(slideIndex+1)+'?'))return;state.slides[slideIndex]={texts:{},objects:[]};selected=null;selectedElement=null;store();location.reload();};
  tb.addEventListener('click',()=>{
    editing=!editing;document.documentElement.classList.toggle('prn-editing',editing);tb.textContent=editing?'✓  Xong chỉnh sửa':'✎  Chỉnh sửa';selected=null;selectedElement=null;updateScale();refreshSlide();
    if(editing)toast('Chế độ chỉnh sửa: nhấp chữ để sửa, chèn ảnh/diagram bằng bảng bên phải.');
  });
  document.addEventListener('focusin',e=>{if(!editing)return;const t=e.target.closest?.('.prn-edit-target');if(!t)return;selectedElement=t;selected=null;refreshPanel();});
  document.addEventListener('input',e=>{if(!editing)return;const t=e.target.closest?.('.prn-edit-target');if(!t)return;const k=t.dataset.prnTextKey;if(!k)return;state.slides[slideIndex].texts[k]={html:t.innerHTML,style:t.style.cssText};store();},true);
  document.addEventListener('keydown',e=>{
    if(!editing)return;
    const focus=document.activeElement;
    const inEditor=focus?.closest?.('#prn-editor-panel,.prn-edit-target') || focus?.isContentEditable;
    if(inEditor){e.stopPropagation();if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter','Backspace','Delete'].includes(e.key))e.stopImmediatePropagation();return;}
    if(e.key==='Escape'){selected=null;selectedElement=null;refreshPanel();getSlide()?.querySelectorAll('.prn-selected').forEach(n=>n.classList.remove('prn-selected'));}
    if((e.key==='Delete'||e.key==='Backspace')&&selected){e.preventDefault();e.stopImmediatePropagation();removeSelected();}
  },true);
  window.addEventListener('wheel',e=>{if(editing)e.stopImmediatePropagation();},true);
  window.addEventListener('resize',()=>{updateScale();scheduleRefresh();});
  window.addEventListener('hashchange',()=>scheduleRefresh());
  document.addEventListener('click',e=>{if(editing&&e.target.closest?.('.slide-inner')&&!e.target.closest('.prn-overlay-object,.prn-edit-target')){selected=null;selectedElement=null;refreshPanel();}},true);
  const obs=new MutationObserver(mutations=>{
    if(mutations.some(m=>Array.from(m.addedNodes).some(n=>n.nodeType===1 && (n.classList?.contains('slide-canvas')||n.querySelector?.('.slide-canvas')))))scheduleRefresh();
  });
  const main=$('#root');if(main)obs.observe(main,{childList:true,subtree:true});
  if(!location.hash)history.replaceState(null,'','#1');
  updateScale();scheduleRefresh();
})();

</script>
</body>
</html>
