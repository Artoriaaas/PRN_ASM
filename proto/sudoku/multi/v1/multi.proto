syntax = "proto3";

package sudoku.multi.v1;

option csharp_namespace = "Sudoku.Multi.V1";

service MultiplayerService {
  rpc GetRankings(GetRankingsRequest) returns (GetRankingsResponse);
  rpc GetMatchHistory(GetMatchHistoryRequest) returns (GetMatchHistoryResponse);
}

message RankingEntry {
  string player_name = 1;
  int32 rating = 2;
  int32 rank = 3;
}

message GetRankingsRequest {
  int32 limit = 1;
}

message GetRankingsResponse {
  repeated RankingEntry rankings = 1;
}

message MatchHistoryItem {
  string match_id = 1;
  string opponent_name = 2;
  bool is_win = 3;
  int32 rating_delta = 4;
  string completed_at = 5;
}

message GetMatchHistoryRequest {
  int32 limit = 1;
}

message GetMatchHistoryResponse {
  repeated MatchHistoryItem matches = 1;
}
