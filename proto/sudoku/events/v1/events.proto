syntax = "proto3";

package sudoku.events.v1;

option csharp_namespace = "Sudoku.Events.V1";

message EventEnvelope {
  string event_id = 1;
  string type = 2;
  string occurred_at = 3;
  string user_id = 4;
  bytes payload = 5;
}

message GameFinished {
  string session_id = 1;
  string user_id = 2;
  string difficulty = 3;
  bool is_win = 4;
  int32 duration_seconds = 5;
  int32 reward_coins = 6;
  int32 score = 7;
  int64 elapsed_ms = 8;
  int32 layout_type = 9;
  int32 mistakes_count = 10;
  int32 hints_used = 11;
}

message MatchCompleted {
  string match_id = 1;
  string winner_user_id = 2;
  string loser_user_id = 3;
  int32 winner_reward_coins = 4;
  int32 rating_delta = 5;
  int32 play_format = 6;
  int32 board_layout = 7;
  string level_id = 8;
  bool is_draw = 9;
  int64 duration_ms = 10;
  string tournament_id = 11;
}
