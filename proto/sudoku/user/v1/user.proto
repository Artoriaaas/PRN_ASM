syntax = "proto3";

package sudoku.user.v1;

option csharp_namespace = "Sudoku.User.V1";

service UserService {
  rpc GetOrCreateProfile(GetOrCreateProfileRequest) returns (GetOrCreateProfileResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc GetProfiles(GetProfilesRequest) returns (GetProfilesResponse);
}

message UserProfile {
  string id = 1;
  string display_name = 2;
  string email = 3;
  string avatar_url = 4;
  int32 total_games = 5;
  int32 wins = 6;
  string country = 7;
  int32 total_exp = 8;
  int32 player_level = 9;
  int32 trophies = 10;
}

message GetOrCreateProfileRequest {
  string display_name = 1;
  string email = 2;
  string avatar_url = 3;
}

message GetOrCreateProfileResponse {
  UserProfile profile = 1;
  bool is_new_user = 2;
}

message GetProfileRequest {
}

message GetProfileResponse {
  UserProfile profile = 1;
}

message UpdateProfileRequest {
  string display_name = 1;
  string avatar_url = 2;
  string country = 3;
}

message UpdateProfileResponse {
  UserProfile profile = 1;
}

message GetProfilesRequest {
  repeated string firebase_uids = 1;
}

message UserProfileSummary {
  string firebase_uid = 1;
  string user_id = 2;
  string display_name = 3;
  string avatar_url = 4;
  string country = 5;
  int32 player_level = 6;
  int32 trophies = 7;
}

message GetProfilesResponse {
  repeated UserProfileSummary profiles = 1;
}
