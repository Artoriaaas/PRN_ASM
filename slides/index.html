.deploy-cols{position:absolute;top:293px;bottom:105px;left:92px;right:92px;display:grid;grid-template-columns:1fr 1fr;gap:28px}.deploy-card{padding:42px;position:relative}.deploy-card:before{content:'';position:absolute;right:0;top:0;width:270px;height:270px;border-radius:0 25px 0 100%;background:radial-gradient(circle at right top,rgba(52,194,243,.13),transparent 70%);pointer-events:none}.deploy-right:before{background:radial-gradient(circle at right top,rgba(159,104,249,.12),transparent 70%)}.deploy-label{color:#5ae2f3;font-size:25px;letter-spacing:1.3px;font-weight:800;display:flex;align-items:center;gap:15px;margin-bottom:40px}.deploy-right .deploy-label{color:#baa7ff}.deploy-copy{font-size:26px;color:#dceafb;line-height:1.55;margin:20px 0}.deploy-logo-strip{position:absolute;bottom:40px;left:42px;display:flex;gap:28px;align-items:center}.deploy-logo-strip .brand-icon{opacity:.85}

.diagram-slide:before{right:-180px;top:-250px;opacity:.6}.diagram-heading{position:absolute;left:92px;right:92px;top:142px}.diagram-heading .kicker{font-size:22px}.diagram-title{font-size:67px;letter-spacing:-2px;margin:19px 0 0;font-weight:800}.diagram-blank{position:absolute;left:92px;right:92px;top:300px;bottom:116px;border-radius:19px;border:1px dashed rgba(88,147,190,.18);background:rgba(8,23,41,.1)}.diagram-corner{position:absolute;width:33px;height:33px;opacity:.47}.corner-tl{left:-1px;top:-1px;border-left:2px solid #39d5ef;border-top:2px solid #39d5ef;border-radius:13px 0 0 0}.corner-tr{right:-1px;top:-1px;border-right:2px solid #39d5ef;border-top:2px solid #39d5ef;border-radius:0 13px 0 0}.corner-bl{left:-1px;bottom:-1px;border-left:2px solid #39d5ef;border-bottom:2px solid #39d5ef;border-radius:0 0 0 13px}.corner-br{right:-1px;bottom:-1px;border-right:2px solid #39d5ef;border-bottom:2px solid #39d5ef;border-radius:0 0 13px 0}

l-head button{border:0;color:#e6f5ff;background:none;font-size:30px}.slide-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.slide-thumb{height:113px;padding:14px;border-radius:12px;border:1px solid #223e56;background:linear-gradient(135deg,#102a48,#0c1b32);display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;overflow:hidden}.slide-thumb.current,.slide-thumb:hover{border-color:#3ccee7;background:linear-gradient(135deg,#164065,#152746)}.thumb-n{font-size:15px;font-weight:800;color:#45d9ee}.thumb-name{font-size:16px;color:#e3f2ff;font-weight:650;max-width:100%;overflow:hidden;text-overflow:ellipsis}.thumb-bar{position:absolute;width:5px;height:100%;background:#43dbe9;left:0;top:0;opacity:0}.slide-thumb.current .thumb-bar{opacity:1}.help-modal{width:min(570px,90vw)}.help-list{display:grid;gap:12px}.help-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #1d344c;font-size:15px;color:#d3e7f5}.keycap{padding:8px 12px;border:1px solid #3b657f;background:#142c46;border-radius:8px;font-weight:700;color:#75dff0}

<style id="prn-editor-css">
/* PRN ASM collaborative-handoff slide editor. The base presentation styles remain intact. */
#prn-editor-toggle{position:fixed;right:22px;top:17px;z-index:8001;display:flex;align-items:center;gap:9px;border:1px solid rgba(80,221,246,.47);color:#ddfaff;background:linear-gradient(120deg,#153f60,#182c54);border-radius:14px;font-weight:800;letter-spacing:.4px;padding:12px 18px;box-shadow:0 8px 30px #030814a0;cursor:pointer}
#prn-editor-toggle:hover{filter:brightness(1.18)}
#prn-editor-panel{position:fixed;right:12px;top:69px;bottom:83px;width:344px;overflow:auto;z-index:8000;border:1px solid #2a496d;border-radius:16px;background:linear-gradient(135deg,#101d33,#10182a);box-shadow:0 24px 80px #0009;color:#e2f6ff;padding:16px 17px 18px;font-family:Inter,'Segoe UI',Arial,sans-serif;display:none;user-select:text}
#prn-editor-panel *{box-sizing:border-box}
#prn-editor-panel h3{font-size:16px;margin:2px 0 12px;color:#f4fdff;letter-spacing:.1px}
#prn-editor-panel h4{font-size:11px;letter-spacing:1.9px;text-transform:uppercase;color:#5ed5e8;margin:17px 0 8px}
#prn-editor-panel p{font-size:12px;line-height:1.55;color:#a0b7ce;margin:7px 0 12px}
#prn-editor-panel button{cursor:pointer;border:1px solid #36516c;background:#182940;color:#def3ff;padding:9px 10px;border-radius:8px;font-size:12px;font-weight:700;white-space:normal}
#prn-editor-panel button:hover{background:#214c68}
#prn-editor-panel button.prn-primary{background:#0d7799;border-color:#18bad5;color:#fff}
#prn-editor-panel button.prn-danger{background:#492638;border-color:#a4496e;color:#ffcbd8}
.prn-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.prn-buttons.full{grid-template-columns:1fr}
.prn-grid-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.prn-field{display:flex;flex-direction:column;gap:5px;font-size:12px;margin:10px 0}
.prn-field span{color:#97b6c8}
.prn-field input,.prn-field select,.prn-field textarea{min-width:0;width:100%;border:1px solid #34516c;border-radius:8px;padding:9px 8px;background:#0b1829;color:#e8f8ff;font:inherit;font-size:13px;outline:none}
.prn-field textarea{resize:vertical;line-height:1.4;min-height:79px}
.prn-field input[type=color]{height:39px;padding:4px;cursor:pointer}
.prn-field input:focus,.prn-field select:focus,.prn-field textarea:focus{border-color:#40d6eb}
.prn-badge{display:inline-flex;color:#a5e5ee;background:#153246;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:700;margin-bottom:6px}
.prn-rule{height:1px;background:#294159;margin:15px 0}
.prn-alert{background:#102e40;border:1px solid #28526a;padding:9px;border-radius:8px;font-size:11px;line-height:1.5;color:#acdcea;margin-top:11px}
.prn-selected-note{color:#83dbe7!important}
.prn-hotkeys{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#7d9aab;margin-top:12px}
.prn-shortcut{border:1px solid #355573;padding:2px 5px;border-radius:4px;color:#bce6f2}
.prn-upload-hidden{display:none!important}
.prn-editing #prn-editor-panel{display:block}
.prn-editing #prn-editor-toggle{right:365px;background:#116b8c;border-color:#52e0f2}
.prn-editing .presentation-shell .stage{left:calc((100% - 370px)/2) !important;top:50% !important;transform:translate(-50%,-50%) scale(var(--prn-editor-stage-scale,0.72)) !important}
.prn-editing .slide-canvas{animation:none!important}
.prn-editing .app-topline{right:375px}
.prn-editing .app-bottom{right:375px}
.prn-editing .prn-edit-target{outline:1px dashed transparent;outline-offset:3px;cursor:text;user-select:text!important;min-width:3px}
.prn-editing .prn-edit-target:hover{outline-color:rgba(71,237,255,.55);background:rgba(68,224,239,.06)}
.prn-editing .prn-edit-target:focus{outline:2px solid #4be4fa!important;background:rgba(10,51,73,.55);border-radius:4px;cursor:text}
.prn-editing .presentation-shell{user-select:text}
.prn-overlay-object{position:absolute;z-index:30;border:2px solid transparent;border-radius:13px;overflow:visible;touch-action:none;box-sizing:border-box;user-select:none;box-shadow:0 6px 20px #06101e55}
.prn-overlay-object img{display:block;width:100%;height:100%;object-fit:contain;border-radius:inherit;pointer-events:none}
.prn-overlay-object.prn-kind-image{background:rgba(4,18,32,.1)}
.prn-overlay-object.prn-kind-text{background:rgba(8,28,47,.68);border:1px solid #2b6578;padding:15px 19px;display:flex;align-items:center;justify-content:center}
.prn-text-body{width:100%;white-space:pre-wrap;text-align:center;word-break:break-word;line-height:1.27;font-weight:700;pointer-events:none}
.prn-overlay-object.prn-kind-diagram{padding:20px 21px;background:linear-gradient(145deg,#0b233a,#12243d);border:1px solid #2c81aa}
.prn-diagram-layout{display:flex;align-items:center;justify-content:space-around;gap:6px;width:100%;height:100%}
.prn-diagram-node{flex:1;padding:14px 8px;text-align:center;color:#dbf7ff;background:#173651;border:1px solid #40bfd1;border-radius:12px;font-weight:750;line-height:1.3;font-size:18px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:calc(100% - 8px);overflow:hidden}
.prn-diagram-arrow{color:#4bd6ee;font-size:23px;flex:0 0 25px;text-align:center}
.prn-object-grip{position:absolute;top:-23px;left:0;border-radius:7px 7px 0 0;background:#166983;color:white;font-size:12px;font-weight:800;letter-spacing:.3px;padding:4px 12px;display:none;cursor:grab;white-space:nowrap}
.prn-object-resizer{position:absolute;bottom:-8px;right:-8px;width:19px;height:19px;background:#5ce2f3;border-radius:4px;border:3px solid #07273e;cursor:nwse-resize;display:none}
.prn-editing .prn-overlay-object{cursor:grab}
.prn-editing .prn-overlay-object:hover{border-color:rgba(63,205,236,.62)}
.prn-editing .prn-overlay-object.prn-selected{border:2px solid #57e5fa;box-shadow:0 0 0 4px #3ad4f024,0 10px 28px #06101e88}
.prn-editing .prn-overlay-object.prn-selected .prn-object-grip,.prn-editing .prn-overlay-object.prn-selected .prn-object-resizer{display:block}
#prn-notice{position:fixed;left:50%;bottom:94px;z-index:99999;transform:translateX(-50%);border:1px solid #3c8598;background:#123348;color:#ecfdff;padding:11px 19px;border-radius:12px;box-shadow:0 10px 30px #000a;font-size:13px;display:none;max-width:min(92vw,760px);text-align:center}
#prn-notice.prn-on{display:block}
@media(max-width:760px){#prn-editor-panel{left:8px;right:8px;width:auto;top:auto;bottom:65px;height:38vh;padding:11px}#prn-editor-toggle{right:8px;top:9px;padding:9px} .prn-editing #prn-editor-toggle{right:8px}.prn-editing .presentation-shell .stage{left:50%!important;top:calc((100% - 38vh - 65px)/2)!important}.prn-editing .app-topline{right:0}.prn-editing .app-bottom{right:0}}

</style>

    if (!value || typeof value !== 'object' || !Array.isArray(value.slides) || value.slides.length !== COUNT) throw new Error('Tệp dữ liệu phải có chính xác 18 slide');

  function keyFor(node,root){let parts=[];while(node&&node!==root){let p=node.parentElement;if(!p)return null;parts.unshift(Array.prototype.indexOf.call(p.children,node));node=p;}return node===root?parts.join('.'):null;}

  $('#prn-add-image').onclick=()=>$('#prn-image-file').click();
  $('#prn-image-file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>7*1024*1024){toast('Ảnh lớn hơn 7MB. Hãy nén ảnh trước khi tải lên.');return;}const reader=new FileReader();reader.onload=()=>addObject({kind:'image',x:490,y:300,w:530,h:360,src:String(reader.result),name:f.name});reader.readAsDataURL(f);e.target.value='';};
  $('#prn-duplicate-object').onclick=()=>{const obj=findObject();if(!obj){toast('Hãy chọn một đối tượng trước.');return;}addObject({...obj,id:newId(),x:obj.x+24,y:obj.y+24})};
  $('#prn-save-local').onclick=()=>{store();toast('Đã lưu trên trình duyệt này. Hãy xuất HTML hoặc JSON để gửi cho người khác.');};
  function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=el('a',{href:url,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
  $('#prn-export-json').onclick=()=>{store();download('PRN_ASM_18_Slides.project.json',JSON.stringify(state,null,2),'application/json');toast('Đã xuất dự án JSON: gửi cho bạn bè để nhập vào cùng bản HTML Editor.');};
  function buildStandalone(){
    const clone=document.documentElement.cloneNode(true);
    const root=clone.querySelector('#root');if(root)root.replaceChildren();
    clone.querySelectorAll('#prn-editor-toggle,#prn-editor-panel,#prn-notice').forEach(n=>n.remove());
    clone.classList.remove('prn-editing');clone.style.removeProperty('--prn-editor-stage-scale');
    const holder=clone.querySelector('#prn-baked-state');if(holder)holder.textContent=JSON.stringify(state).replace(/</g,'\\u003c');
    return '<!doctype html>\n'+clone.outerHTML;
  }
  $('#prn-export-html').onclick=()=>{store();download('index.html',buildStandalone(),'text/html');toast('Đã xuất index.html – có thể đăng GitHub Pages hoặc chia sẻ như một file độc lập.');};
  $('#prn-import-json').onclick=()=>$('#prn-json-file').click();
  $('#prn-json-file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const v=readState(JSON.parse(await f.text()));if(!confirm('Nhập file dự án sẽ thay thế các chỉnh sửa đang lưu trên trình duyệt. Tiếp tục?'))return;state=v;selected=null;selectedElement=null;store();refreshSlide();toast('Đã nhập dự án 18 slide.');}catch(err){toast('Không đọc được dự án: '+err.message)}finally{e.target.value='';}};
  $('#prn-reset-slide').onclick=()=>{if(!confirm('Khôi phục toàn bộ thay đổi trên slide '+(slideIndex+1)+'?'))return;state.slides[slideIndex]={texts:{},objects:[]};selected=null;selectedElement=null;store();location.reload();};
  tb.addEventListener('click',()=>{
    editing=!editing;document.documentElement.classList.toggle('prn-editing',editing);tb.textContent=editing?'✓  Xong chỉnh sửa':'✎  Chỉnh sửa';selected=null;selectedElement=null;updateScale();refreshSlide();
    if(editing)toast('Chế độ chỉnh sửa: nhấp chữ để sửa, chèn ảnh/diagram bằng bảng bên phải.');
  });
  document.addEventListener('focusin',e=>{if(!editing)return;const t=e.target.closest?.('.prn-edit-target');if(!t)return;selectedElement=t;selected=null;refreshPanel();});
  document.addEventListener('input',e=>{if(!editing)return;const t=e.target.closest?.('.prn-edit-target');if(!t)return;const k=t.dataset.prnTextKey;if(!k)return;state.slides[slideIndex].texts[k]={html:t.innerHTML,style:t.style.cssText};store();},true);
  document.addEventListener('keydown',e=>{
    if(!editing)return;
    const focus=document.activeElement;
    const inEditor=focus?.closest?.('#prn-editor-panel,.prn-edit-target') || focus?.isContentEditable;
    if(inEditor){e.stopPropagation();if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter','Backspace','Delete'].includes(e.key))e.stopImmediatePropagation();return;}
    if(e.key==='Escape'){selected=null;selectedElement=null;refreshPanel();getSlide()?.querySelectorAll('.prn-selected').forEach(n=>n.classList.remove('prn-selected'));}
    if((e.key==='Delete'||e.key==='Backspace')&&selected){e.preventDefault();e.stopImmediatePropagation();removeSelected();}
  },true);
  window.addEventListener('wheel',e=>{if(editing)e.stopImmediatePropagation();},true);
  window.addEventListener('resize',()=>{updateScale();scheduleRefresh();});
  window.addEventListener('hashchange',()=>scheduleRefresh());
  document.addEventListener('click',e=>{if(editing&&e.target.closest?.('.slide-inner')&&!e.target.closest('.prn-overlay-object,.prn-edit-target')){selected=null;selectedElement=null;refreshPanel();}},true);
  const obs=new MutationObserver(mutations=>{
    if(mutations.some(m=>Array.from(m.addedNodes).some(n=>n.nodeType===1 && (n.classList?.contains('slide-canvas')||n.querySelector?.('.slide-canvas')))))scheduleRefresh();
  });
  const main=$('#root');if(main)obs.observe(main,{childList:true,subtree:true});
  if(!location.hash)history.replaceState(null,'','#1');
  updateScale();scheduleRefresh();
})();

</script>
</body>
</html>
